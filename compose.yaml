
services:
  postgres:
    image: postgres:17
    container_name: groceries-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - groceries_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groceries -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  groceries_postgres_data: