spring.datasource.url=jdbc:postgresql://localhost:5433/postgres
spring.datasource.username=postgres
spring.datasource.password=Pass123a
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway will look in db/migration by default
spring.flyway.enabled=true

# Hibernate settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# OpenAPI/Swagger Configuration
spring.application.name=Grocieries API
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=true

# AWS Region
spring.cloud.aws.region.static=us-east-1

# Credentials
spring.cloud.aws.credentials.access-key=${AWS_ACCESS_KEY_ID}
spring.cloud.aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY}

# Custom Queue Property
aws.sqs.analytics-queue=analytics-groceries-queue
