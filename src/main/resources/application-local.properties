# Local PostgreSQL configuration
spring.datasource.url=jdbc:postgresql://localhost:5433/${POSTGRES_DB:postgres}
spring.datasource.username=${POSTGRES_USER:groceries}
spring.datasource.password=${POSTGRES_PASSWORD}

# Disable real AWS SQS integration locally
spring.cloud.aws.sqs.enabled=false

# Local placeholder credentials - not real AWS credentials
spring.cloud.aws.credentials.access-key=local
spring.cloud.aws.credentials.secret-key=local
